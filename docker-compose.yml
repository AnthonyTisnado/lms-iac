services:
  sonarqube:
    image: sonarqube:26.7.0.124771-community
    container_name: lms-iac-sonarqube
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions

  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    image: lms-iac-jenkins:local
    container_name: lms-iac-jenkins
    depends_on:
      - sonarqube
    ports:
      - "8082:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home

volumes:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
  jenkins_home:
